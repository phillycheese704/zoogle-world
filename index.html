  function currentPlayers(){
    const out=[],ids=new Set([...mp.presences.keys(),...mp.cursors.keys()]),nowMs=Date.now();
    for(const id of ids){
      if(id===mp.userId)continue;
      const p=mp.presences.get(id)||{},cur=mp.cursors.get(id)||{};
      const pSeen=mp.presenceSeen.get(id)||0,cSeen=cur.seen||0;
      if(nowMs-Math.max(pSeen,cSeen)>=MP_CURSOR_GRACE_MS){mp.cursors.delete(id);mp.presences.delete(id);mp.presenceSeen.delete(id);continue}
      out.push({user_id:id,username:p.username||cur.username||'Player',area:cur.area||p.area||'main',x:Number.isFinite(cur.x)?cur.x:.5,y:Number.isFinite(cur.y)?cur.y:.5});

      visible.add(p.user_id);let el=[...layer.children].find(n=>n.dataset.player===p.user_id);
      if(!el){el=document.createElement('div');el.className='mp-cursor';el.dataset.player=p.user_id;el.innerHTML='<span class="mp-cursor-name"></span>'+zHeadHtml();el.style.setProperty('--mp-ring',userRing(p.user_id));layer.appendChild(el)}
      const name=el.querySelector('.mp-cursor-name');if(name.textContent!==p.username)name.textContent=p.username;
      const x=Math.max(8,Math.min(innerWidth-50,p.x*innerWidth)),y=Math.max(28,Math.min(innerHeight-35,p.y*innerHeight));
      el.style.transform=`translate3d(${x}px,${y}px,0)`;
    }
    for(const el of [...layer.children])if(!visible.has(el.dataset.player))el.remove();
    renderArrowPlayers('mpLeftPlayers',left);renderArrowPlayers('mpRightPlayers',right);positionArrowPlayers();
  }

  function renderArrowPlayers(id,list){const el=document.getElementById(id);if(!el)return;const key=JSON.stringify(list.map(p=>[p.user_id,p.username]));if(el.dataset.key===key)return;el.dataset.key=key;const shown=list.slice(0,2);el.innerHTML=shown.map(p=>`<span class="mp-off-player" style="--mp-ring:${userRing(p.user_id)}">${zHeadHtml()}<span class="mp-off-name">${escapeHtml(p.username)}</span></span>`).join('')+(list.length>2?`<span class="mp-more">+${list.length-2}</span>`:'');el.style.display=list.length?'flex':'none'}
  function positionArrowPlayers(){[['mpLeftPlayers','prevArea'],['mpRightPlayers','nextArea']].forEach(([id,bid])=>{const el=document.getElementById(id),b=document.getElementById(bid);if(!el||!b)return;const r=b.getBoundingClientRect();el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.bottom+5)+'px'})}
  function sendCursor(x,y,force=false){
    if(Number.isFinite(x))lastCursorX=Math.max(0,Math.min(1,x));
    if(Number.isFinite(y))lastCursorY=Math.max(0,Math.min(1,y));
    if(!mp.active||!mp.channel||!mp.connected)return;const t=performance.now();if(!force&&t-cursorLastSent<48)return;cursorLastSent=t;
    mp.channel.send({type:'broadcast',event:'cursor',payload:{user_id:mp.userId,username:getUsername(),area:state.currentArea,x:lastCursorX,y:lastCursorY}}).catch(()=>{})
  }
  function startCursorHeartbeat(){clearInterval(cursorHeartbeatTimer);cursorHeartbeatTimer=setInterval(()=>{if(mp.active&&mp.channel)sendCursor(lastCursorX,lastCursorY,true);renderRemotePlayers()},2000);sendCursor(lastCursorX,lastCursorY,true)}
  window.addEventListener('pointermove',e=>sendCursor(e.clientX/innerWidth,e.clientY/innerHeight),{passive:true});window.addEventListener('pointerdown',e=>sendCursor(e.clientX/innerWidth,e.clientY/innerHeight),{passive:true});
  document.addEventListener('focusin',e=>{if(!mp.active)return;const r=e.target?.getBoundingClientRect?.();if(r&&r.width&&r.height)sendCursor((r.left+r.width/2)/innerWidth,(r.top+r.height/2)/innerHeight)});
  window.addEventListener('resize',()=>{positionArrowPlayers();renderRemotePlayers()});


  // All durable changes now use RPC leases + fenced commits. Broadcasts contain only hints.
  function broadcastState(){if(mp.active&&mp.channel)mp.channel.send({type:'broadcast',event:'state',payload:{revision:mp.revision}}).catch(()=>{})}
  function scheduleHostCommit(){return window.ZoogleAtomic.pull()}
  save=function(){if(mp.guestActive||mp.applying||window.ZoogleAtomic?.busy)return;return baseSave.apply(this,arguments)};
  tickZoogles=function(dt){if(mp.active||window.ZoogleAtomic?.awaitingHome||window.ZoogleAtomic?.transitioning||window.ZoogleIslandSharing?.visiting){renderWeatherBanner();return}return baseTickZoogles.apply(this,arguments)};
  renderArea=function(){const r=baseRenderArea.apply(this,arguments);if(mp.active){trackPresence();requestAnimationFrame(renderRemotePlayers)}return r};


  async function joinGuestSession(row,pending){
    if(window.ZoogleAtomic.busy||window.ZoogleAtomic.transitioning){showToast('Finish the current action before joining.');return}window.ZoogleAtomic.transitioning=true;

      const {client,user}=await clientAndUser();
      baseSave();const home=clone(state),area=state.currentArea;
      delete home.__sharedSession;
      await suspend();mp.homeState=home;mp.homeArea=area;window.ZoogleAtomic.clearTransient();
      mp.role='guest';mp.active=true;mp.guestActive=true;mp.sessionId=row.session_id;mp.revision=-1;mp.islandCode=row.island_code||pending.code;mp.islandName=row.island_name||pending.islandName||'Zoogle Island';mp.hostUsername=row.host_username||'Host';mp.userId=user.id;
      const hb=await client.rpc('zoogle_v1_heartbeat',{p_session_id:mp.sessionId,p_username:getUsername()});if(hb.error)throw hb.error;
      state.currentArea='main';state.breedSelect={p1:null,p2:null};window.ZoogleAtomic.confirmed=null;window.ZoogleAtomic.accept(row,true);
      document.body.classList.add('mp-live','mp-guest');document.getElementById('visitorBannerText').textContent=`Playing in ${mp.islandName}`;document.getElementById('visitorBanner')?.style.setProperty('display','flex');
      document.getElementById('visitorReturnHome').onclick=()=>leaveGuestSession('Welcome home!');
      document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id));await connectRealtime();
      clearInterval(mpHeartbeatTimer);mpHeartbeatTimer=setInterval(memberHeartbeat,9000);
      showToast(`Joined ${mp.islandName}!`);
      try{await client.rpc('visit_zoogle_world',{p_code:mp.islandCode})}catch(e){}
    }catch(e){console.warn('Could not join multiplayer session',e);await leaveGuestSession('Could not join the live world.')}finally{window.ZoogleAtomic.transitioning=false}
  }
  async function suspend(){
    mp.epoch++;mp.active=false;clearInterval(mpHeartbeatTimer);clearInterval(requestPollTimer);clearInterval(guestHealthTimer);clearTimeout(mp.hostMissingTimer);mp.hostMissingTimer=0;
    await disconnectRealtime();mp.presences.clear();mp.presenceSeen.clear();mp.cursors.clear();mp.requests=[];updateRequestBadge();mp.role=null;mp.sessionId=null;mp.revision=0;document.body.classList.remove('mp-live');renderRemotePlayers();
  }
  async function leaveGuestSession(message='Welcome home!'){
    if(!mp.guestActive)return;
    window.ZoogleAtomic.transitioning=true;

    if(home){state=home;state.currentArea=area;delete state.__sharedSession;window.ZoogleAtomic.migrate(state);window.ZoogleAtomic.awaitingHome=false}
    document.body.classList.remove('mp-live','mp-guest');document.getElementById('visitorBanner')?.style.removeProperty('display');document.getElementById('visitorReturnHome').onclick=()=>window.ZoogleIslandSharing.returnHome();
    document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id));renderAll();baseSave();showToast(message);
    await leaving;try{const client=await window.ZoogleIslandSharing.getClient();await client.rpc('zoogle_v1_leave',{p_session_id:sid})}catch(e){}

  }

  async function hostHeartbeat(){if(hostBusy||!mp.active||mp.role!=='host'||mp.guestActive||window.ZoogleIslandSharing?.visiting)return;hostBusy=true;try{const ready=await ensureHostSession();if(ready){await memberHeartbeat();await pollRequests()}}finally{hostBusy=false}}
  async function startHostServices(){
    // Offline by default: keep Passport viewing and join-request polling available,
    // but do not create a live multiplayer session until the host accepts a request.
    if(mp.guestActive||window.ZoogleIslandSharing?.visiting)return;
    ensureMultiplayerUi();watchPassport();ensureUsernameRow();clearInterval(mpHeartbeatTimer);mpHeartbeatTimer=0;clearInterval(requestPollTimer);requestPollTimer=setInterval(pollRequests,2000);await pollRequests();
  }
  async function startLiveHostServices(){
    if(!mp.active||mp.role!=='host'||mp.guestActive||window.ZoogleIslandSharing?.visiting)return;
    ensureMultiplayerUi();watchPassport();ensureUsernameRow();clearInterval(mpHeartbeatTimer);clearInterval(requestPollTimer);mpHeartbeatTimer=setInterval(hostHeartbeat,9000);requestPollTimer=setInterval(pollRequests,2000);await memberHeartbeat();await pollRequests();
  }

  // Prevent the host-reset action from being triggered while a guest is inside someone else's live world.
  document.addEventListener('click',e=>{if(mp.guestActive&&e.target.closest('#settingsReset,#resetProgressBtn')){e.preventDefault();e.stopImmediatePropagation();showToast('Return home before resetting your save.')}},true);
  window.addEventListener('keydown',e=>{if(mp.guestActive&&e.ctrlKey&&e.key.toLowerCase()==='d'){e.preventDefault();e.stopImmediatePropagation();showToast('Return home before resetting your save.')}},true);
  window.addEventListener('online',()=>{if(mp.active){connectRealtime();window.ZoogleAtomic.pull();if(mp.role==='host')startLiveHostServices()}else startHostServices()});
  window.addEventListener('beforeunload',()=>{if(mp.guestActive){try{mp.channel?.untrack?.()}catch(e){}}});

  window.addEventListener('focus',()=>{if(mp.active){trackPresence(true);sendCursor(lastCursorX,lastCursorY,true)}if(!mp.guestActive){pollRequests();connectRequestInbox()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(mp.active){trackPresence(true);sendCursor(lastCursorX,lastCursorY,true)}if(!mp.guestActive){pollRequests();connectRequestInbox()}}});
  document.getElementById('worldVisitBtn')?.addEventListener('click',()=>setTimeout(()=>{pollRequests();connectRequestInbox()},0));
  restorePendingRequest();if(mp.pendingRequest)setTimeout(()=>{renderPendingJoinCard();startPendingPoll()},650);ensureMultiplayerUi();setTimeout(startHostServices,900);
  window.ZoogleMultiplayer={
    get guestActive(){return mp.guestActive},get active(){return mp.active},get role(){return mp.role},get username(){return getUsername()},
    renderGuestPassport,requestJoin:requestJoinByCode,leave:leaveGuestSession,
    broadcast:broadcastState,commit:()=>window.ZoogleAtomic.pull(),connect:connectRealtime,suspend,resume:startHostServices,tick:baseTickZoogles,persist:baseSave,get state(){return mp}
  };
})();

<script id="zoogle-mutation-lab-sync-script">
(()=>{
  const LAB_COST=250,LAB_UNLOCK_COST=750;
  const LAB_TIERS={
    I:{label:'Tier I',ms:5*60*1000,success:90},
    II:{label:'Tier II',ms:15*60*1000,success:70},
    III:{label:'Tier III',ms:30*60*1000,success:50},
    IV:{label:'Tier IV',ms:60*60*1000,success:30}
  };
  const LAB_MUTATION_TIER={
    wet:'I',snowy:'I',burnt:'I',embermut:'I',glowingmut:'I',golden:'I',
    icy:'II',heatstricken:'II',moltenmut:'II',auroramut:'II',shiny:'II',
    diamond:'III',magmamut:'III',radiantmut:'III',glitched:'III',
    starhit:'IV',stary:'IV',abducted:'III'
  };
  let labPickerOpen=false;

  // New mutation and area registration.
  if(!V6_MUTATIONS.failed)V6_MUTATIONS.failed={name:'Failed',sellBonus:-.20,amountBonus:-.10,speedBonus:-.25,visual:'failedmut',forceNoGems:true};
  if(!AREAS.some(a=>a.id==='lab'))AREAS.push({id:'lab',name:'Mutation Lab'});

  function mpApi(){return window.ZoogleMultiplayer}
  function mpActive(){return !!mpApi()?.active}
  function mpState(){return mpApi()?.state||null}
  function myUserId(){return mpState()?.userId||'local'}
  function myUsername(){return mpApi()?.username||'Player'}
  function now(){return worldNow()}
  async function syncServerClock(){return now()}


  function ensureLabState(){
    state.mutationLabUnlocked=!!state.mutationLabUnlocked;
    if(!state.mutationLab||typeof state.mutationLab!=='object')state.mutationLab={zoogle:null,origin:null,experiment:null,consoleLock:null};
    const L=state.mutationLab;L.zoogle=L.zoogle||null;L.origin=L.origin||null;L.experiment=L.experiment||null;L.consoleLock=L.consoleLock||null;
    if(!state.sharedPlacement||typeof state.sharedPlacement!=='object')state.sharedPlacement=null;
    for(const e of state.eggs||[]){if(!e.uid)e.uid='egg_'+id()}
    for(const b of state.breedings||[]){if(!b.uid)b.uid='breed_'+id()}
  }

  const baseEnsureV6State=ensureV6State;
  ensureV6State=function(){const r=baseEnsureV6State.apply(this,arguments);ensureLabState();return r};
  ensureLabState();

  // Failed is a real stat mutation, and its gem lock overrides Gem Finder entirely.
  const baseGetMutationData=getMutationData;
  getMutationData=function(z){
    const d=baseGetMutationData.apply(this,arguments),m=(z?.mutations||[]);if(!m.includes('failed'))return d;
    // baseGetMutationData already applies Failed's -20/-10/-25 via V6_MUTATIONS.
    d.forceNoGems=true;return d;
  };
  const baseRollNextEarningMode=rollNextEarningMode;
  rollNextEarningMode=function(z){if((z?.mutations||[]).includes('failed')){z.mode='coin';return}return baseRollNextEarningMode.apply(this,arguments)};
  const baseMutationEffectSummary=mutationEffectSummary;
  mutationEffectSummary=function(mid,d){if(mid==='failed')return '-20% sell, -10% gen amount, -25% gen speed, 0% gem chance (overrides Gem Finder)';return baseMutationEffectSummary.apply(this,arguments)};
  const baseMutationSourceText=mutationSourceText;
  mutationSourceText=function(mid){if(mid==='failed')return 'Failed Mutation Lab experiment';return baseMutationSourceText.apply(this,arguments)};
  const baseMutationChanceText=mutationChanceText;
  mutationChanceText=function(mid){if(mid==='failed')return 'Only when a Mutation Lab experiment fails';return baseMutationChanceText.apply(this,arguments)};

  getEggLeft=function(i=0){const e=state.eggs[i];return e?Math.max(0,e.endAt-worldNow()):0};
  getBreedLeft=function(i=0){const b=state.breedings[i];return b?Math.max(0,b.endAt-worldNow()):0};

  function unlockedMutationLab(){return !!state.mutationLabUnlocked}
  function labMutationDef(mid){const tier=LAB_MUTATION_TIER[mid]||'II';return{...LAB_TIERS[tier],tier}}
  function labSuccessChance(z,mid){const base=labMutationDef(mid).success,penalty=((z?.mutations||[]).length||0)*5;return Math.max(1,base-penalty)}
  function formatLabTime(ms){return formatTime(Math.max(0,ms))}

  function ensureLabScreen(){
    let el=document.getElementById('mutationLabScreen');if(el)return el;
    el=document.createElement('div');el.id='mutationLabScreen';el.className='mutation-lab-screen';document.querySelector('.stage')?.appendChild(el);return el;
  }
  function unlockMutationLab(){if(!window.ZoogleAtomic?.reducing)return window.ZoogleAtomic.run('lab-unlock',()=>unlockMutationLab());if(state.mutationLabUnlocked)return;if(state.coins<LAB_UNLOCK_COST){showToast('Not enough coins!');return}state.coins-=LAB_UNLOCK_COST;state.mutationLabUnlocked=true;playBuy();renderCurrencies();renderArea();showToast('Mutation Lab unlocked!');save()}

  function labZoogleVisual(z){return z?`<div class="zoogle-wrap preview-stable">${createZoogleVisual(z.type,0,'',false,z)}</div>`:''}
  function renderMutationLab(){
    if(window.ZoogleAtomic?.reducing){window.ZoogleAtomic.effect(()=>renderMutationLab());return}
    ensureLabState();const screen=ensureLabScreen();screen.style.display='block';
    if(!state.mutationLabUnlocked){screen.innerHTML=`<h2>Mutation Lab</h2><div class="lab-machine-wrap"><div class="lab-machine"><div class="lab-machine-top"></div><div class="lab-machine-arm"></div><div class="lab-tank"><div class="lab-bubbles"></div></div><div class="lab-platform"></div></div><div class="lab-panel"><h3>Locked</h3><button id="unlockMutationLab" class="green-btn">UNLOCK — 🪙${LAB_UNLOCK_COST}</button><p class="lab-fail-warning">Failure replaces all mutations with Failed.</p></div></div>`;screen.querySelector('#unlockMutationLab').onclick=unlockMutationLab;return}
    const L=state.mutationLab,z=L.zoogle,exp=L.experiment,lock=L.consoleLock;
    const liveLock=lock&&lock.expiresAt>now()?lock:null;
    const key=JSON.stringify([state.mutationLabUnlocked,z?.uid,z?.mutations,!!exp,exp?.mutation,liveLock?.userId,liveLock?.username]);
    if(screen.dataset.renderKey===key&&screen.firstElementChild){updateLabTimer(screen,exp);return}screen.dataset.renderKey=key;
    let machine=`<div class="lab-machine"><div class="lab-machine-top"></div><div class="lab-machine-arm"></div><div class="lab-tank"><div class="lab-bubbles"></div><div class="lab-zoogle-holder">${labZoogleVisual(z)}</div>${!z?'<button id="labAddZoogle" class="blue-btn lab-add-btn">ADD<br>ZOOGLE</button>':''}</div><div class="lab-platform"></div></div>`;
    let panel='';
    if(!z){panel=`<div class="lab-panel"><h3>Empty Chamber</h3><div class="lab-status">🪙${LAB_COST} per experiment</div><p class="lab-fail-warning">Failure replaces all mutations with Failed.</p></div>`}
    else if(exp){const left=Math.max(0,exp.endAt-now()),total=Math.max(1,exp.endAt-exp.startedAt),pct=Math.max(0,Math.min(100,(1-left/total)*100));panel=`<div class="lab-panel"><h3>${escapeHtml(z.customName||ZOOGLES[z.type]?.name||'Zoogle')}</h3><div class="lab-status">${escapeHtml(V6_MUTATIONS[exp.mutation]?.name||exp.mutation)} • ${exp.successChance}% • ${labMutationDef(exp.mutation).label}</div><div class="lab-timer">${left>0?formatLabTime(left):'FINISHING…'}</div><div class="lab-progress"><span style="width:${pct}%"></span></div><p class="lab-fail-warning">Cannot cancel.</p></div>`}
    else{const chanceNote=(z.mutations||[]).length?`Stack −${z.mutations.length*5}%`:'';panel=`<div class="lab-panel"><h3>${escapeHtml(z.customName||ZOOGLES[z.type]?.name||'Zoogle')}</h3><div class="lab-status">${formatMutationList(z.mutations)}${chanceNote?`<br>${chanceNote}`:''}</div><button id="labPickMutation" class="purple-btn" style="width:100%">PICK MUTATION</button><p class="lab-return-note">Returns to ${escapeHtml((AREAS.find(a=>a.id===L.origin?.island)?.name)||'its island')} on success.</p>${liveLock&&liveLock.userId!==myUserId()?`<div class="lab-console-lock">${escapeHtml(liveLock.username||'Another player')} is using the console…</div>`:''}</div>`}
    screen.innerHTML=`<h2>Mutation Lab</h2><div class="lab-machine-wrap">${machine}${panel}</div>`;updateLabTimer(screen,exp);
    screen.querySelector('#labAddZoogle')?.addEventListener('click',openLabZooglePicker);
    screen.querySelector('#labPickMutation')?.addEventListener('click',openLabMutationPicker);
  }

  function updateLabTimer(screen,exp){if(!exp)return;const left=Math.max(0,exp.endAt-now()),total=Math.max(1,exp.endAt-exp.startedAt);const timer=screen.querySelector('.lab-timer'),bar=screen.querySelector('.lab-progress span');if(timer)timer.textContent=left?formatLabTime(left):'FINISHING…';if(bar)bar.style.width=Math.max(0,Math.min(100,(1-left/total)*100))+'%'}
  async function openLabZooglePicker(){
    ensureLabState();if(state.mutationLab.zoogle){showToast('The chamber is occupied.');return}
    const list=(state.zoogles||[]).filter(z=>!isBusy(z.uid));els.infoTitle.textContent='Add Zoogle to Mutation Lab';
    els.infoContent.innerHTML=list.length?`<div class="shop-grid">${list.map(z=>`<div class="shop-card"><h3>${escapeHtml(z.customName||ZOOGLES[z.type].name)}</h3><span class="rarity-tag ${rarityClass(ZOOGLES[z.type].rarity)}">${ZOOGLES[z.type].rarity}</span><div class="mutation-line">${formatMutationList(z.mutations)}</div><button class="green-btn" data-lab-add="${z.uid}">ADD ZOOGLE</button></div>`).join('')}</div>`:'<div class="info-panel">No available Zoogles.</div>';
    openModal('infoModal');els.infoContent.querySelectorAll('[data-lab-add]').forEach(b=>b.onclick=()=>{closeModal('infoModal');sendToMutationLab(b.dataset.labAdd)});
  }
  function sendToMutationLab(uid){if(!window.ZoogleAtomic?.reducing)return window.ZoogleAtomic.run('lab-send',()=>sendToMutationLab(uid));
    ensureLabState();if(!state.mutationLabUnlocked)return showToast('Unlock the Mutation Lab first!');if(state.mutationLab.zoogle)return showToast('The Mutation Lab is occupied!');const idx=state.zoogles.findIndex(z=>z.uid===uid);if(idx<0)return;const z=state.zoogles[idx];if(isBusy(uid))return showToast('That Zoogle is busy breeding!');
    state.zoogles.splice(idx,1);state.mutationLab.zoogle=z;state.mutationLab.origin={island:z.island||'main',x:z.x,y:z.y};state.mutationLab.experiment=null;state.mutationLab.consoleLock=null;closeZoogleMenu();renderArea();showToast(`${z.customName||ZOOGLES[z.type].name} sent to the Mutation Lab.`);save();
  }

  async function openLabMutationPicker(){
    ensureLabState();if(!state.mutationLab.zoogle||state.mutationLab.experiment)return;
    const acquired=await window.ZoogleAtomic.run('lab-console',()=>{const L=state.mutationLab,lock=L.consoleLock;if(!L.zoogle||L.experiment)return false;if(lock&&lock.expiresAt>now()&&lock.userId!==myUserId())return false;L.consoleLock={userId:myUserId(),username:myUsername(),expiresAt:now()+45000};return true});
    if(!acquired)return showToast('Console in use.');labPickerOpen=true;renderMutationLab();const z=state.mutationLab.zoogle;

    const ids=Object.keys(V6_MUTATIONS).filter(mid=>mid!=='failed');
    els.infoTitle.textContent='Choose Mutation';els.infoContent.innerHTML=`<div class="info-panel lab-danger">Failure replaces all mutations with <strong>Failed</strong>.</div><div class="lab-picker-grid">${ids.map(mid=>{const d=V6_MUTATIONS[mid],t=labMutationDef(mid),chance=labSuccessChance(z,mid),has=(z.mutations||[]).includes(mid);return `<div class="lab-mut-card"><h4>${escapeHtml(d.name)}</h4><span class="lab-tier">${t.label}</span><div class="small-note">${formatLabTime(t.ms)} • <strong>${chance}%</strong> • 🪙${LAB_COST}</div><button class="${has?'wood-btn':'purple-btn'}" data-lab-mut="${mid}" ${has?'disabled':''}>${has?'OWNED':'SELECT'}</button></div>`}).join('')}</div>`;openModal('infoModal');
    els.infoContent.querySelectorAll('[data-lab-mut]').forEach(b=>b.onclick=()=>confirmLabMutation(b.dataset.labMut));
  }
  async function closeLabPickerLock(){if(!labPickerOpen)return;labPickerOpen=false;await window.ZoogleAtomic.run('lab-console-close',()=>{const L=state.mutationLab;if(L?.consoleLock?.userId===myUserId())L.consoleLock=null});if(state.currentArea==='lab')renderMutationLab()}

  document.addEventListener('click',e=>{if(labPickerOpen&&e.target.closest('[data-close="infoModal"]'))setTimeout(closeLabPickerLock,0)},true);

  function confirmLabMutation(mid){
    const L=state.mutationLab,z=L.zoogle;if(!z||L.experiment||!V6_MUTATIONS[mid]||mid==='failed')return;const t=labMutationDef(mid),chance=labSuccessChance(z,mid);
    showConfirm({title:`Attempt ${V6_MUTATIONS[mid].name}?`,body:`<strong>Time:</strong> ${formatLabTime(t.ms)}<br><strong>Success:</strong> ${chance}%<br><strong>Cost:</strong> 🪙${LAB_COST}<br><br><strong style="color:#922d24">Failure permanently removes ALL current mutations and gives Failed.</strong>`,okText:'Start Experiment',danger:true,onOk:()=>window.ZoogleAtomic.run('lab-start',()=>startLabExperiment(mid))});
  }
  function startLabExperiment(mid){
    ensureLabState();const L=state.mutationLab,z=L.zoogle;if(!z||L.experiment||!V6_MUTATIONS[mid]||mid==='failed')return;if(L.consoleLock?.userId!==myUserId()||L.consoleLock.expiresAt<=now())return showToast('Reopen the console to begin.');if((z.mutations||[]).includes(mid))return showToast('That Zoogle already has this mutation.');if((z.mutations||[]).length>=10)return showToast('Mutation stack is full.');if(state.coins<LAB_COST)return showToast('Not enough coins!');
    const t=labMutationDef(mid),chance=labSuccessChance(z,mid),start=now();state.coins-=LAB_COST;L.experiment={mutation:mid,startedAt:start,endAt:start+t.ms,successChance:chance,willSucceed:Math.random()*100<chance,startedBy:myUserId(),startedByName:myUsername()};L.consoleLock=null;labPickerOpen=false;closeModal('infoModal');renderCurrencies();renderMutationLab();showToast(`${V6_MUTATIONS[mid].name} experiment started!`);save();
  }
  function finishLabExperiment(){
    ensureLabState();const L=state.mutationLab,exp=L.experiment,z=L.zoogle;if(!z||!exp||exp.endAt>now())return false;
    if(exp.willSucceed){if(!z.mutations.includes(exp.mutation))z.mutations.push(exp.mutation);addMastery(z,15);state.quests.stats.mutations=(state.quests.stats.mutations||0)+1;showToast(`${z.customName||ZOOGLES[z.type].name} gained ${V6_MUTATIONS[exp.mutation].name}!`)}
    else{z.mutations=['failed'];z.mode='coin';showToast(`Experiment failed — ${z.customName||ZOOGLES[z.type].name} became Failed.`)}
    const o=L.origin||{island:'main',x:50,y:50};z.island=o.island||'main';z.x=Number.isFinite(o.x)?o.x:50;z.y=Number.isFinite(o.y)?o.y:50;state.zoogles.push(z);L.zoogle=null;L.origin=null;L.experiment=null;L.consoleLock=null;save();renderAll();if(state.currentArea==='lab')renderMutationLab();return true;
  }

  // Render Mutation Lab as its own area after Breeding Cave.
  const oldRenderAreaLab=renderArea;
  renderArea=function(){ensureLabState();const screen=ensureLabScreen();screen.style.display='none';const r=oldRenderAreaLab.apply(this,arguments);if(state.currentArea==='lab'){els.areaName.textContent='Mutation Lab';els.island.style.display='none';els.islandShadow.style.display='none';els.areaPanel.classList.add('hidden');els.caveScreen.style.display='none';els.hatchSlot.style.display='none';renderMutationLab()}else{screen.style.display='none'}return r};

  // Add the Lab action to every Zoogle control panel once unlocked.
  const oldOpenZoogleMenuLab=openZoogleMenu;
  openZoogleMenu=function(uid,x,y){oldOpenZoogleMenuLab.apply(this,arguments);ensureLabState();if(!state.mutationLabUnlocked)return;const z=getZoogle(uid);if(!z)return;const main=els.zoogleMenu.querySelector('.zoogle-menu-main');if(!main||els.zoogleMenu.querySelector('[data-act="mutation-lab"]'))return;const sec=document.createElement('section');sec.className='menu-section menu-lab-section';const occupied=!!state.mutationLab.zoogle;sec.innerHTML=`<div class="menu-section-title">Mutation Lab</div><button class="blue-btn compact-action" data-act="mutation-lab" ${occupied?'disabled':''}>${occupied?'Lab Busy':'Send to Lab'}</button>`;main.appendChild(sec);sec.querySelector('[data-act="mutation-lab"]')?.addEventListener('click',()=>sendToMutationLab(uid))};

  // Durable actions run through the fenced world transaction coordinator.
  // This one UI timer never resolves experiments or rewrites timestamps on guests.
  setInterval(()=>{if(state.currentArea==='lab')renderMutationLab();if(labPickerOpen&&!document.getElementById('infoModal')?.classList.contains('open'))closeLabPickerLock()},500);

  // Keep Settings/debug aware of the new area.
  if(window.ZoogleDebug){const oldUnlockAll=window.ZoogleDebug.unlockAll;window.ZoogleDebug.unlockAll=function(){oldUnlockAll?.();state.mutationLabUnlocked=true;ensureLabState();renderAll();save()}}
  window.ZoogleMutationLab={render:renderMutationLab,send:sendToMutationLab,now,syncClock:syncServerClock,finish:finishLabExperiment,start:startLabExperiment,pick:openLabMutationPicker,closePicker:closeLabPickerLock,get state(){ensureLabState();return state.mutationLab}};
})();
</script>

.lab-risk-meter{margin:9px 0;padding:8px;border-radius:12px;background:rgba(22,58,52,.08);border:2px solid rgba(31,83,72,.15)}.lab-risk-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:1000}.lab-risk-track{height:8px;margin-top:5px;border-radius:999px;background:linear-gradient(90deg,#c55545,#e3ad48,#64b968);position:relative;overflow:hidden}.lab-risk-marker{position:absolute;top:-3px;width:4px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgba(42,42,32,.55);transform:translateX(-50%)}.lab-effect{margin:6px 0 7px;padding:6px 7px;border-radius:9px;background:rgba(83,145,126,.08);font-size:9px;font-weight:900;line-height:1.35}.lab-result-pop{position:absolute;z-index:20;left:50%;top:50%;width:min(330px,86%);transform:translate(-50%,-50%);padding:18px;border-radius:20px;text-align:center;background:rgba(255,250,229,.97);border:4px solid rgba(74,53,29,.55);box-shadow:0 18px 45px rgba(0,0,0,.28);animation:labResultPop .55s cubic-bezier(.15,.8,.2,1.18)}.lab-result-pop.success{box-shadow:0 18px 45px rgba(0,0,0,.28),0 0 32px rgba(83,214,155,.42)}.lab-result-pop.fail{box-shadow:0 18px 45px rgba(0,0,0,.28),0 0 32px rgba(214,78,64,.36)}.lab-result-pop strong{display:block;font-size:25px;margin-bottom:5px}.lab-result-pop span{font-weight:900}.lab-result-pop.fade{animation:labResultFade .35s ease forwards}
@keyframes labBaseHum{50%{opacity:.55;transform:scaleX(1.08)}}@keyframes labFluidWave{50%{transform:translateY(8px) rotate(3deg)}}@keyframes labScan{to{transform:translateY(650%)}}@keyframes labMachineHum{to{transform:translateX(.7px)}}@keyframes labSubjectFloat{50%{transform:scale(1.12) translateY(-7px)!important}}@keyframes labLightBlink{50%{opacity:.35}}@keyframes labResultPop{from{opacity:0;transform:translate(-50%,-42%) scale(.72)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes labResultFade{to{opacity:0;transform:translate(-50%,-58%) scale(.94)}}

<script id="zoogle-pre-island-polish-controller">
(()=>{
  const POLISH_VERSION='pre-island-polish-1';
  const qStats=()=>state.quests?.stats||(state.quests.stats={});
  function ensurePolishState(){
    state.quests=state.quests||{dailyRefreshAt:0,daily:null,dailyClaimed:{},dailyBaseline:{},claimed:{},stats:{}};
    state.quests.claimed=state.quests.claimed||{};state.quests.dailyClaimed=state.quests.dailyClaimed||{};state.quests.dailyBaseline=state.quests.dailyBaseline||{};
    const s=qStats();['eggsHatched','collected','bred','earned','mutations','ancientMeteor'].forEach(k=>{if(!Number.isFinite(Number(s[k])))s[k]=0});
    state.polishVersion=POLISH_VERSION;
  }
  const baseEnsureV6State=ensureV6State;
  ensureV6State=function(){const r=baseEnsureV6State.apply(this,arguments);ensurePolishState();return r};
  ensurePolishState();

  /* More daily variety without invalidating today's existing set. */
  const extraDaily=[
    {id:'hatch1quick',name:'Hatch an egg',need:1,stat:'eggsHatched',reward:{coins:80},icon:'🥚'},
    {id:'hatch5',name:'Hatch 5 eggs',need:5,stat:'eggsHatched',reward:{gems:3},icon:'🐣'},
    {id:'collect25',name:'Collect from 25 Zoogles',need:25,stat:'collected',reward:{coins:240},icon:'🪙'},
    {id:'earn1000',name:'Earn 1,000 coins',need:1000,stat:'earned',reward:{coins:350},icon:'💰'},
    {id:'breed2',name:'Complete 2 breedings',need:2,stat:'bred',reward:{gems:4},icon:'💕'},
    {id:'mut2',name:'Gain 2 mutations',need:2,stat:'mutations',reward:{gems:4},icon:'✨'}
  ];
  extraDaily.forEach(q=>{if(!DAILY_QUEST_POOL.some(x=>x.id===q.id))DAILY_QUEST_POOL.push(q)});

  function countDiscovered(rarity=null){return Object.keys(state.discovered||{}).filter(k=>state.discovered[k]&&(!rarity||ZOOGLES[k]?.rarity===rarity)).length}
  function maxMastery(){return Math.max(0,...(state.zoogles||[]).map(z=>Number(z.masteryLevel)||0))}
  function countMastery(level){return (state.zoogles||[]).filter(z=>(Number(z.masteryLevel)||0)>=level).length}
  function questLists(tab){
    if(tab==='daily')return DAILY_QUEST_POOL.filter(q=>(state.quests.daily||[]).includes(q.id)).map(q=>({...q,icon:q.icon||'📜'}));
    if(tab==='progress')return [
      {id:'rocky',icon:'🪨',name:'Unlock Rocky Island',need:1,value:state.rockyUnlocked?1:0,reward:{coins:250}},
      {id:'storage',icon:'📦',name:'Unlock Storage Cliffs',need:1,value:state.storageCliffsUnlocked?1:0,reward:{coins:350}},
      {id:'tribal',icon:'🗿',name:'Unlock Tribal Island',need:1,value:state.tribalUnlocked?1:0,reward:{gems:5}},
      {id:'labunlock',icon:'🧪',name:'Unlock the Mutation Lab',need:1,value:state.mutationLabUnlocked?1:0,reward:{gems:8}},
      {id:'discover10',icon:'📖',name:'Discover 10 Zoogles',need:10,value:countDiscovered(),reward:{coins:500}},
      {id:'discover25',icon:'📖',name:'Discover 25 Zoogles',need:25,value:countDiscovered(),reward:{coins:900,gems:3}},
      {id:'discover50',icon:'📚',name:'Discover 50 Zoogles',need:50,value:countDiscovered(),reward:{coins:1800,gems:7}},
      {id:'discover75',icon:'🏅',name:'Discover 75 Zoogles',need:75,value:countDiscovered(),reward:{gems:15}},
      {id:'discover100',icon:'🏆',name:'Discover 100 Zoogles',need:100,value:countDiscovered(),reward:{gems:30}},
      {id:'hatch10life',icon:'🥚',name:'Hatch 10 eggs',need:10,value:qStats().eggsHatched||0,reward:{coins:650}},
      {id:'hatch25life',icon:'🐣',name:'Hatch 25 eggs',need:25,value:qStats().eggsHatched||0,reward:{coins:1300,gems:5}},
      {id:'breed5life',icon:'💕',name:'Complete 5 breedings',need:5,value:qStats().bred||0,reward:{coins:800}},
      {id:'breed15life',icon:'🧬',name:'Complete 15 breedings',need:15,value:qStats().bred||0,reward:{gems:12}},
      {id:'earn5k',icon:'💰',name:'Earn 5,000 coins',need:5000,value:qStats().earned||0,reward:{coins:750}},
      {id:'earn25k',icon:'💰',name:'Earn 25,000 coins',need:25000,value:qStats().earned||0,reward:{gems:10}}
    ];
    return [
      {id:'ancient1',icon:'☄️',name:'Claim your first Ancient meteor',need:1,value:qStats().ancientMeteor||0,reward:{gems:15}},
      {id:'legendary1',icon:'👑',name:'Discover your first Legendary',need:1,value:countDiscovered('Legendary')?1:0,reward:{gems:10}},
      {id:'legendary5',icon:'👑',name:'Discover 5 Legendary Zoogles',need:5,value:countDiscovered('Legendary'),reward:{gems:18}},
      {id:'celestial1',icon:'🌌',name:'Discover your first Celestial',need:1,value:countDiscovered('Celestial')?1:0,reward:{gems:25}},
      {id:'celestial5',icon:'✨',name:'Discover 5 Celestial Zoogles',need:5,value:countDiscovered('Celestial'),reward:{gems:35}},
      {id:'ancient5',icon:'🦴',name:'Discover 5 Ancient Zoogles',need:5,value:countDiscovered('Ancient'),reward:{gems:40}},
      {id:'mut3',icon:'🧬',name:'Own a Zoogle with 3 mutations',need:1,value:(state.zoogles||[]).some(z=>(z.mutations||[]).length>=3)?1:0,reward:{coins:500}},
      {id:'mut5',icon:'🧬',name:'Own a Zoogle with 5 mutations',need:1,value:(state.zoogles||[]).some(z=>(z.mutations||[]).length>=5)?1:0,reward:{gems:8}},
      {id:'mut10',icon:'🧬',name:'Own a Zoogle with 10 mutations',need:1,value:(state.zoogles||[]).some(z=>(z.mutations||[]).length>=10)?1:0,reward:{gems:30}},
      {id:'failed1',icon:'⚠️',name:'Survive a Failed mutation',need:1,value:(state.zoogles||[]).some(z=>(z.mutations||[]).includes('failed'))?1:0,reward:{coins:1000,gems:5}},
      {id:'mastery5',icon:'⭐',name:'Reach Mastery 5 on a Zoogle',need:5,value:maxMastery(),reward:{gems:12}},
      {id:'masterytrio',icon:'🌟',name:'Have 3 Zoogles at Mastery 5',need:3,value:countMastery(5),reward:{gems:25}}
    ];
  }
  function questRewardText(r){return `${r?.coins?`🪙${formatAmount(r.coins)}`:''}${r?.coins&&r?.gems?' + ':''}${r?.gems?`💎${formatAmount(r.gems)}`:''}`||'—'}
  function claimBurst(text='Quest complete!'){
    const d=document.createElement('div');d.className='quest-claim-burst';d.textContent='✓ '+text;d.style.left='50%';d.style.top='45%';document.body.appendChild(d);setTimeout(()=>d.remove(),950);try{screenSparkles(8)}catch(e){}
  }
  const baseClaimQuest=claimQuest;
  claimQuest=function(id,tab,q){const claims=tab==='daily'?state.quests.dailyClaimed:state.quests.claimed,was=!!claims?.[id];const r=baseClaimQuest.apply(this,arguments);if(!was&&claims?.[id]){claimBurst('Quest claimed!');showToast('Quest reward claimed!')}return r};
  function batchClaim(tab,list){if(!window.ZoogleAtomic?.reducing)return window.ZoogleAtomic.run('quest-batch',()=>batchClaim(tab,questLists(tab)));
    const claims=tab==='daily'?state.quests.dailyClaimed:state.quests.claimed;let coins=0,gems=0,count=0;
    for(const q of list){if(claims[q.id])continue;const val=getQuestValue(q,tab);if(val<q.need)continue;if(q.reward?.coins){state.coins+=q.reward.coins;coins+=q.reward.coins}if(q.reward?.gems){state.gems+=q.reward.gems;gems+=q.reward.gems}claims[q.id]=true;count++}
    if(!count)return;renderCurrencies();renderQuests(tab);save();claimBurst(`${count} quests claimed!`);showToast(`Claimed ${count} quests${coins?` • 🪙${coins}`:''}${gems?` • 💎${gems}`:''}`)
  }
  renderQuests=function(tab='daily'){
    ensurePolishState();refreshDailyQuestsIfNeeded();const grid=document.getElementById('questGrid');if(!grid)return;const list=questLists(tab),claims=tab==='daily'?state.quests.dailyClaimed:state.quests.claimed;
    const ready=list.filter(q=>!claims[q.id]&&getQuestValue(q,tab)>=q.need).length,done=list.filter(q=>claims[q.id]).length;
    const reset=tab==='daily'?` • resets in ${formatTime(Math.max(0,(state.quests.dailyRefreshAt||0)-worldNow()))}`:'';
    grid.innerHTML=`<div class="quest-overview"><div><div class="quest-overview-copy">${done}/${list.length}${ready?` • ${ready} ready`:''}</div>${tab==='daily'?`<div class="small-note">${reset.replace(' • ','')}</div>`:''}</div><button class="green-btn quest-claim-all" type="button" ${ready?'':'disabled'}>CLAIM ${ready}</button></div>`+list.map(q=>{const val=Math.max(0,getQuestValue(q,tab)),pct=Math.max(0,Math.min(100,val/q.need*100)),claimed=!!claims[q.id],complete=val>=q.need;return `<div class="quest-card ${complete&&!claimed?'quest-ready':''} ${claimed?'quest-claimed':''}"><div class="quest-card-head"><h3>${q.icon||'📜'} ${escapeHtml(q.name)}</h3>${claimed||complete?`<span class="quest-type-chip">${claimed?'✓':'READY'}</span>`:''}</div><div class="quest-progress-row"><span></span><span>${Math.min(Math.floor(val),q.need)} / ${q.need}</span></div><div class="quest-progress-track"><span style="width:${pct}%"></span></div><div class="quest-reward">${questRewardText(q.reward)}</div><button class="green-btn" data-claim-quest="${q.id}" ${!complete||claimed?'disabled':''}>${claimed?'✓':'CLAIM'}</button></div>`}).join('');
    grid.querySelector('.quest-claim-all')?.addEventListener('click',()=>batchClaim(tab,list));grid.querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.claimQuest,tab,list.find(q=>q.id===b.dataset.claimQuest)));
  };
  function updateQuestReadyBadge(){const b=document.getElementById('questsBtn');if(!b)return;let ready=0;for(const tab of ['daily','progress','special']){if(tab==='daily')refreshDailyQuestsIfNeeded();const claims=tab==='daily'?state.quests.dailyClaimed:state.quests.claimed;ready+=questLists(tab).filter(q=>!claims[q.id]&&getQuestValue(q,tab)>=q.need).length}b.classList.toggle('quest-ready',ready>0);b.title=ready?`Quests • ${ready} reward${ready===1?'':'s'} ready`:'Quests'}

  /* Multiplayer polish. Uses the existing Realtime channel; no extra database tables. */
  function mp(){return window.ZoogleMultiplayer?.state||null}
  function mpName(){return String(safeStorage.getItem('zoogleWorldUsernameV1')||'Player').slice(0,16)}
  function gameNow(){return window.ZoogleMutationLab?.now?.()||Date.now()}
  function ensureMpUi(){
    if(!document.getElementById('mpPolishHud')){const h=document.createElement('div');h.id='mpPolishHud';h.innerHTML='<span class="mp-polish-dot"></span><strong>LIVE</strong><span id="mpPolishCount">1/4</span><span class="mp-polish-role" id="mpPolishRole">HOST</span><span class="mp-polish-sync" id="mpPolishSync">SYNCED</span>';document.body.appendChild(h)}
    if(!document.getElementById('mpActivityFeed')){const f=document.createElement('div');f.id='mpActivityFeed';f.setAttribute('aria-live','polite');document.body.appendChild(f)}
  }
  function activity(text,kind='remote'){
    ensureMpUi();const f=document.getElementById('mpActivityFeed');if(!f)return;const d=document.createElement('div');d.className=`mp-activity ${kind}`;d.textContent=text;f.prepend(d);while(f.children.length>4)f.lastElementChild.remove();setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)},4200)
  }
  function sendActivity(text,kind='remote'){
    const m=mp();if(!m?.active)return;const localText=text.startsWith('is ')?`are ${text.slice(3)}`:text.startsWith('has ')?`have ${text.slice(4)}`:text;activity(`You ${localText}`,kind);if(!m.channel)return;try{m.channel.send({type:'broadcast',event:'shared-action',payload:{action:'activity-only',from:m.userId,username:mpName(),activity:{text,kind}}})}catch(e){}
  }
  if(window.ZoogleSharedActions?.receive){const baseSharedReceive=window.ZoogleSharedActions.receive;window.ZoogleSharedActions.receive=function(p){if(p?.action==='activity-only'){if(p.from!==mp()?.userId)activity(`${p.username||'Player'} ${p.activity?.text||'did something'}`,p.activity?.kind||'remote');return}return baseSharedReceive.apply(this,arguments)}}

  const baseBuyEggPolish=buyEgg;
  buyEgg=function(id,currency){const before=(state.eggs||[]).length,r=baseBuyEggPolish.apply(this,arguments);if((state.eggs||[]).length>before)sendActivity(`bought ${EGGS[id]?.name||'an egg'}`,'good');return r};
  const baseBuyUpgradePolish=buyUpgrade;
  buyUpgrade=function(id,currency){const before=state.upgrades?.[id]||0,r=baseBuyUpgradePolish.apply(this,arguments);if((state.upgrades?.[id]||0)>before)sendActivity(`upgraded ${UPGRADE_DATA[id]?.name||'an upgrade'}`,'good');return r};
  const baseTryBreedPolish=tryStartBreeding;
  tryStartBreeding=function(){const before=(state.breedings||[]).length,p1=getZoogle(state.breedSelect?.p1),p2=getZoogle(state.breedSelect?.p2),names=p1&&p2?`${p1.customName||ZOOGLES[p1.type].name} + ${p2.customName||ZOOGLES[p2.type].name}`:'';const r=baseTryBreedPolish.apply(this,arguments);if((state.breedings||[]).length>before)sendActivity(`started breeding ${names||'two Zoogles'}`,'remote');return r};
  const baseOpenHatchPolish=openHatch;
  openHatch=function(eggClass){const mode=pendingMode,ctx=pendingContext;const r=baseOpenHatchPolish.apply(this,arguments);els.hatchOverlay?.querySelector('.hatch-kind-banner')?.remove();if(mode==='breed'){const br=state.breedings?.[ctx?.breedIndex??-1];sendActivity(`is opening ${br?`${br.p1Name} + ${br.p2Name}`:'a breeding result'}`,'remote')}else{const e=state.eggs?.[ctx?.eggIndex??-1];sendActivity(`is hatching ${EGGS[e?.eggId]?.name||'an egg'}`,'remote')}return r};
  const baseCrackEggPolish=crackEgg;
  crackEgg=function(){const r=baseCrackEggPolish.apply(this,arguments);const egg=els.eggClickArea;if(egg){egg.classList.remove('polish-crack-hit');void egg.offsetWidth;egg.classList.add('polish-crack-hit');setTimeout(()=>egg.classList.remove('polish-crack-hit'),190)}return r};
  const baseFinishHatchPolish=finishHatch;
  finishHatch=function(){const type=pendingResult,wasNew=type?!state.discovered?.[type]:false,rar=ZOOGLES[type]?.rarity||'Common';const r=baseFinishHatchPolish.apply(this,arguments);setTimeout(()=>{const c=els.resultCard;if(!c?.classList.contains('show'))return;c.classList.add('polished-result');if(!c.querySelector('.hatch-rarity-banner')){const b=document.createElement('div');b.className='hatch-rarity-banner';b.innerHTML=`<span>${escapeHtml(rar.toUpperCase())}</span>${wasNew?'<span class="new-discovery">NEW DISCOVERY!</span>':''}`;c.prepend(b)}try{screenSparkles(wasNew?18:10)}catch(e){}},620);return r};
  const baseAttemptPlacePolish=attemptPlaceAt;
  attemptPlaceAt=function(x,y){const before=placement?{...placement}:null,wasNew=!!(placement&&!placement.existingId),area=state.currentArea;const r=baseAttemptPlacePolish.apply(this,arguments);if(wasNew&&before&&!placement){sendActivity(`placed ${ZOOGLES[before.type]?.name||'a Zoogle'} on ${AREAS.find(a=>a.id===area)?.name||'an island'}`,'good')}return r};

  let knownPlayers=null,lastRevision=-1;
  function updateMpPolish(){
    ensureMpUi();const m=mp(),hud=document.getElementById('mpPolishHud');if(!m?.active){hud?.classList.remove('reconnecting');knownPlayers=null;return}
    const players=[...m.presences.values()].filter(Boolean),count=Math.min(4,Math.max(1,players.length||1)),joined=String(m.channel?.state||'').toLowerCase()==='joined';
    document.getElementById('mpPolishCount').textContent=`${count}/4`;document.getElementById('mpPolishRole').textContent=(m.role||'player').toUpperCase();document.getElementById('mpPolishSync').textContent=joined?'SYNCED':'RECONNECTING';hud.classList.toggle('reconnecting',!joined);
    if(lastRevision!==-1&&m.revision!==lastRevision){hud.classList.remove('sync-pulse');void hud.offsetWidth;hud.classList.add('sync-pulse')}lastRevision=m.revision;
    const current=new Map(players.filter(p=>p.user_id&&p.user_id!==m.userId).map(p=>[p.user_id,p.username||'Player']));
    if(knownPlayers){for(const [id,name] of current)if(!knownPlayers.has(id))activity(`${name} joined the world`,'good');for(const [id,name] of knownPlayers)if(!current.has(id))activity(`${name} left the world`,'leave')}knownPlayers=current;
  }

  /* Hatchery and breeding progress bars are decorative and derive from canonical timers. */
  function decorateHatchery(){
    const root=els.hatchSlot;if(!root?.classList.contains('active'))return;root.querySelectorAll('.hatch-nest').forEach(card=>{const btn=card.querySelector('[data-hatch-egg],[data-skip-egg]');if(!btn)return;const idx=Number(btn.dataset.hatchEgg??btn.dataset.skipEgg),e=state.eggs?.[idx];if(!e)return;const bar=card.querySelector('.hatch-progress'),total=Math.max(1,Number(e.hatchMs)||Number(EGGS[e.eggId]?.hatchMs)||1),left=Math.max(0,e.endAt-gameNow()),pct=Math.max(0,Math.min(100,(1-left/total)*100));if(bar?.firstElementChild)bar.firstElementChild.style.width=`${pct}%`;card.classList.toggle('busy',!!e.hatching&&e.hatching.expiresAt>gameNow())})
  }
  function decorateCave(){
    if(state.currentArea!=='cave'||!state.breedingUnlocked)return;els.caveScreen?.classList.add('polished-cave');els.caveScreen?.querySelectorAll('.breed-row').forEach(row=>{const btn=row.querySelector('[data-hatch-breed],[data-skip-breed]');if(!btn)return;const idx=Number(btn.dataset.hatchBreed??btn.dataset.skipBreed),b=state.breedings?.[idx];if(!b)return;const left=Math.max(0,b.endAt-gameNow()),total=Math.max(1,Number(b.duration)||left||1),pct=Math.max(0,Math.min(100,(1-left/total)*100));row.classList.toggle('breed-ready',left<=0);let bar=row.querySelector('.breed-progress');if(!bar){bar=document.createElement('div');bar.className='breed-progress';bar.innerHTML='<span></span>';row.querySelector('div:nth-child(2)')?.appendChild(bar)}if(bar)bar.firstElementChild.style.width=`${pct}%`})
  }

<script id="aliens-v1-world">
/* Zoogle World — Aliens V1. One canonical state, one fenced write at a time.
   The browser stays a static single-file game. Supabase owns membership,
   revision/lease fencing, idempotency receipts and merchant transactions. */
(()=>{
  const clone=v=>typeof structuredClone==='function'?structuredClone(v):JSON.parse(JSON.stringify(v));
  const mp=()=>window.ZoogleMultiplayer?.state;
  const active=()=>!!mp()?.active;
  const user=()=>active()?(mp()?.userId||'local'):'local';
  const username=()=>window.ZoogleMultiplayer?.username||'Player';
  const uuid=()=>crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
  const KEYS=['coins','gems','rockyUnlocked','storageCliffsUnlocked','tribalUnlocked','breedingUnlocked','mutationLabUnlocked','moonUnlocked','mothershipUnlocked','zoogles','storageChest','discovered','claimed','eggs','breedings','collectAllReadyAt','upgrades','weather','nextAncientRollAt','ancientMeteorActive','quests','mutationLab','sharedPlacement','merchant','totemInventory','simulationAt','islandCode','islandName','schemaVersion'];
  let offset=0,lastClockSample=0,transactionEpoch=0,pulling=false,pullQueued=false,effects=[],renderKeys={},lastBackground=0,pendingCommit=null;
  // Live multiplayer is session-only. A page load always starts the home world offline.
  if(state&&state.__sharedSession)delete state.__sharedSession;
  const W=window.ZoogleAtomic={busy:false,reducing:false,transitioning:false,confirmed:null,awaitingHome:false,tutorialDone:!!state.tutorialDone,
    now:()=>Date.now()+offset,
    clock(ms,start=Date.now()){
      const end=Date.now();if(!Number.isFinite(Number(ms))||end-start>5000)return;
      const sample=Number(ms)-(start+end)/2;
      offset=lastClockSample?offset*.25+sample*.75:sample;lastClockSample=end;
    },
    effect(fn){if(W.reducing)effects.push(fn);else fn()},
    localSaveState(){
      if(mp()?.guestActive||window.ZoogleIslandSharing?.visiting)return null;
      if(active()&&W.confirmed)return {...clone(W.confirmed),currentArea:state.currentArea,breedSelect:clone(state.breedSelect),tutorialDone:W.tutorialDone,pendingPlacement:null};
      return state;
    },
    cancel(){transactionEpoch++;pendingCommit=null;W.busy=false;W.reducing=false;effects=[]},
    migrate(s){
      s.schemaVersion=7;s.moonUnlocked=!!s.moonUnlocked;s.mothershipUnlocked=!!s.mothershipUnlocked;
      s.totemInventory=s.totemInventory&&typeof s.totemInventory==='object'?s.totemInventory:{};
      s.merchant=s.merchant&&['active','cooldown','waiting'].includes(s.merchant.phase)?s.merchant:null;
      s.eggs=Array.isArray(s.eggs)?s.eggs:[];s.breedings=Array.isArray(s.breedings)?s.breedings:[];
      for(const [arr,prefix] of [[s.eggs,'egg'],[s.breedings,'breed']])for(const e of arr){
        e.uid=e.uid||prefix+'_'+id();if(prefix==='egg'){e.eggId=e.eggId||e.type||'starter';if(!EGGS[e.eggId])e.eggId='starter'}
        if(!Number.isFinite(e.endAt))e.endAt=worldNow();
      }
      for(const z of [...(s.zoogles||[]),...(s.storageChest||[]).map(e=>e.zoogle),s.mutationLab?.zoogle].filter(Boolean)){
        z.mutations=[...new Set(Array.isArray(z.mutations)?z.mutations:[])];
        if(['moon','mothership','lab','cave'].includes(z.island))z.island='main';
      }
      const sp=s.sharedPlacement;
      if(sp&&(!sp.id||!sp.ownerId||!ZOOGLES[sp.type]||!Number.isFinite(sp.expiresAt)))s.sharedPlacement=null;
      if(!s.sharedPlacement&&s.pendingPlacement&&ZOOGLES[s.pendingPlacement.type]){
        s.sharedPlacement={id:s.pendingPlacement.id||'place_'+id(),ownerId:'local',username:'Player',type:s.pendingPlacement.type,mutations:[...new Set(s.pendingPlacement.mutations||[])],stage:'placing',expiresAt:0};
      }
      if(!active()&&s.sharedPlacement)s.sharedPlacement.ownerId='local';
      s.simulationAt=Number.isFinite(s.simulationAt)?s.simulationAt:worldNow();
      delete s.__timerSyncSession;
      return s;
    },

      const out={};for(const key of KEYS)if(state[key]!==undefined)out[key]=clone(state[key]);
      if(out.sharedPlacement?.ownerId==='local'&&mp()?.userId)out.sharedPlacement.ownerId=mp().userId;
      return out;
    },

  function merchantStock(){const bag=[];for(const [id,item] of Object.entries(MERCHANT_ITEMS))for(let i=0;i<item.weight;i++)bag.push(id);const stock={};for(let i=0;i<8;i++){const key=bag[Math.floor(Math.random()*bag.length)];stock[key]=(stock[key]||0)+1}return stock}
  function advanceMerchant(){
    if(active()||!state.moonUnlocked)return;
    const t=worldNow();if(!state.merchant)state.merchant={phase:'active',visitId:'visit_'+id(),endAt:t+(120+Math.floor(Math.random()*301))*1000,stock:merchantStock()};
    let m=state.merchant,n=0;
    while(t>=m.endAt&&n++<10000){const boundary=m.endAt;if(m.phase==='active')m={phase:'cooldown',visitId:m.visitId,endAt:boundary+240000,stock:{}};else if(m.phase==='cooldown')m={phase:'waiting',visitId:m.visitId,endAt:boundary+(180+Math.floor(Math.random()*361))*1000,stock:{}};else m={phase:'active',visitId:'visit_'+id(),endAt:boundary+(120+Math.floor(Math.random()*301))*1000,stock:merchantStock()}}
    state.merchant=m;
  }
  async function buyMerchant(itemId,visitId){
    if(W.transitioning||window.ZoogleIslandSharing?.visiting)return false;
    if(pendingCommit){W.pull();showToast('Checking the previous action…');return false}
    if(!active())return W.run('merchant-buy',()=>{
      advanceMerchant();const m=state.merchant,item=MERCHANT_ITEMS[itemId];if(!state.moonUnlocked||!item||m?.phase!=='active'||m.visitId!==visitId||!(m.stock[itemId]>0))return false;
      if(state.gems<item.cost)return showToast('Not enough gems!');if(item.kind==='egg'&&state.eggs.length>=getMaxEggSlots())return showToast('All egg slots are full!');
      state.gems-=item.cost;m.stock[itemId]--;
      if(item.kind==='egg'){const egg=EGGS[item.eggId],ms=getAdjustedHatchMs(egg.hatchMs);state.eggs.push({uid:'egg_'+id(),eggId:egg.id,endAt:worldNow()+ms,hatchMs:ms})}else state.totemInventory[item.totemId]=(state.totemInventory[item.totemId]||0)+1;
      showToast(`${item.name} purchased.`);playBuy();
    });
    if(W.busy)return;W.busy=true;const sid=mp().sessionId,epoch=mp().epoch,request=uuid();
    try{const client=await window.ZoogleIslandSharing.getClient(),args={p_session_id:sid,p_visit_id:visitId,p_item:itemId,p_request_id:request};pendingCommit={sid,rpc:'zoogle_v1_merchant_buy',args};let r=await client.rpc('zoogle_v1_merchant_buy',args);if(r.error)r=await client.rpc('zoogle_v1_merchant_buy',args);if(r.error)throw r.error;const row=Array.isArray(r.data)?r.data[0]:r.data;
      if(!active()||mp().sessionId!==sid||mp().epoch!==epoch)return;
      pendingCommit=null;
      W.busy=false;W.accept(row);if(row.purchased){playBuy();showToast(`${MERCHANT_ITEMS[itemId].name} purchased.`);window.ZoogleMultiplayer.broadcast()}else showToast(row.reason||'That stock is no longer available.');
    }catch(e){showToast('Purchase not confirmed. Reconnecting…');console.warn(e)}finally{if(mp()?.sessionId===sid){W.busy=false;W.pull()}}
  }
  function unlockSystem(area,cost,prerequisite){return W.run('unlock-'+area,()=>{if(state[area+'Unlocked'])return false;if(prerequisite&&!state[prerequisite])return showToast('Unlock '+(area==='moon'?'Rocky Island':'Moon')+' first.');if(state.coins<cost)return showToast('Not enough coins!');state.coins-=cost;state[area+'Unlocked']=true;advanceMerchant();playBuy();showToast((area==='moon'?'Moon':'Mothership')+' unlocked!')})}
  function screen(id,cls){let e=$(id);if(!e){e=document.createElement('section');e.id=id;e.className=cls;document.querySelector('.stage').appendChild(e)}return e}
  function renderMoon(){
    const root=screen('moonScreen','space-screen moon-screen');root.hidden=false;
    if(!state.moonUnlocked){const key='locked';if(root.dataset.key!==key){root.dataset.key=key;root.innerHTML='<div class="lunar-scene"><div class="distant-world"></div><div class="lunar-ground"></div><div class="floating-rock"></div></div><div class="space-heading"><h2>Moon</h2><button class="green-btn" id="unlockMoon">UNLOCK — 🪙2,000</button></div>';$('unlockMoon').onclick=()=>unlockSystem('moon',2000)}return}
    const m=state.merchant,key=m?JSON.stringify([m.phase,m.visitId,m.stock]):'waiting';
    if(root.dataset.key!==key){root.dataset.key=key;root.innerHTML=`<div class="lunar-scene"><div class="distant-world"></div><div class="lunar-ground"></div><div class="floating-rock"></div><div class="merchant-craft ${m?.phase==='active'?'landed':'away'}"><span class="craft-dome"></span><span class="craft-hull"></span><span class="craft-lights"></span></div></div><div class="space-heading"><div><span class="space-eyebrow">MOON</span><h2>Space Merchant</h2></div><span id="merchantTimer" class="space-timer"></span></div><div class="merchant-stock">${m?.phase==='active'?Object.entries(m.stock).filter(([id,n])=>n>0&&MERCHANT_ITEMS[id]).sort((a,b)=>MERCHANT_ITEMS[a[0]].cost-MERCHANT_ITEMS[b[0]].cost).map(([id,n])=>{const item=MERCHANT_ITEMS[id];return `<article class="merchant-card">${item.kind==='egg'?`<div class="egg-shape ${EGGS[item.eggId].eggClass}"></div>`:`<div class="totem-icon">${TOTEM_DATA[item.totemId].icon}</div>`}<h3>${escapeHtml(item.name)} (x${n})</h3>${item.normal?`<span class="old-price">💎${item.normal}</span>`:'<span class="merchant-exclusive">EXCLUSIVE</span>'}<button class="blue-btn" data-merchant-buy="${id}">💎${item.cost}</button></article>`}).join('')||'<p class="space-empty">Sold out this visit.</p>':'<p class="space-empty">The landing pad is quiet.</p>'}</div><div class="merchant-bag"><button class="wood-btn" id="merchantBag">TOTEMS${Object.values(state.totemInventory).some(n=>n>0)?' · OWNED':''}</button></div>`;
      root.querySelectorAll('[data-merchant-buy]').forEach(b=>b.onclick=()=>buyMerchant(b.dataset.merchantBuy,m.visitId));$('merchantBag').onclick=()=>{currentShopTab='totems';document.querySelectorAll('[data-shop-tab]').forEach(b=>b.classList.toggle('active',b.dataset.shopTab==='totems'));renderShop();openModal('shopModal')};
    }
    const timer=$('merchantTimer');if(timer){const label=m?.phase==='active'?'DEPARTS':m?.phase==='cooldown'?'COOLDOWN':'ARRIVES';timer.textContent=m?`${label} ${formatTime(Math.max(0,m.endAt-worldNow()))}`:'ARRIVING…'}
    root.querySelectorAll('[data-merchant-buy]').forEach(b=>{const item=MERCHANT_ITEMS[b.dataset.merchantBuy];b.disabled=state.gems<item.cost||(item.kind==='egg'&&state.eggs.length>=getMaxEggSlots())||!!m&&m.endAt<=worldNow();b.title=item.kind==='egg'&&state.eggs.length>=getMaxEggSlots()?'Free a Hatchery slot':''});
  }
  function upgradeCard(id){const u=UPGRADE_DATA[id],lvl=state.upgrades[id]||0,max=getUpgradeMax(id),done=lvl>=max;return `<article class="upgrade-compact"><div class="upgrade-top"><h3>${u.name}</h3><span>${done?'MAX':`Lv ${lvl} / ${max}`}</span></div><p>${upgradeDescription(id,lvl)}</p><div class="upgrade-level-track"><span style="width:${lvl/max*100}%"></span></div>${done?'<span class="upgrade-max">MAX</span>':`<div class="shop-actions"><button class="gold-btn" data-upgrade="${id}" data-currency="coin">🪙${getUpgradeCost(id)}</button><button class="blue-btn" data-upgrade="${id}" data-currency="gem">💎${getUpgradeGemCost(id)}</button></div>`}</article>`}
  function bindUpgrades(root){root.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.upgrade,b.dataset.currency))}
  renderUpgrades=function(){if(W.reducing){W.effect(()=>renderUpgrades());return}els.shopGrid.className='shop-grid upgrade-grid';els.shopGrid.innerHTML=Object.keys(UPGRADE_DATA).filter(id=>!UPGRADE_DATA[id].module).sort((a,b)=>UPGRADE_DATA[a].base-UPGRADE_DATA[b].base).map(upgradeCard).join('');bindUpgrades(els.shopGrid)};
  function renderMothership(){
    const root=screen('mothershipScreen','space-screen mothership-screen');root.hidden=false;
    const key=JSON.stringify([state.mothershipUnlocked,state.moonUnlocked,state.upgrades,Object.entries(SYSTEM_MODULES).map(([id,m])=>[id,!!m.unlocked()])]);if(root.dataset.key===key)return;root.dataset.key=key;
    root.innerHTML=`<div class="ship-window"><div class="ship-planet"></div><div class="ship-conduit"></div></div><div class="terminal-heading"><span>[ SYSTEM CONTROL ]</span><h2>Mothership</h2><span class="terminal-online">● ${state.mothershipUnlocked?'ONLINE':'STANDBY'}</span></div>`;
    if(!state.mothershipUnlocked){root.innerHTML+=`<div class="terminal-locked"><button class="green-btn" id="unlockMothership" ${state.moonUnlocked?'':'disabled'}>${state.moonUnlocked?'UNLOCK — 🪙10,000':'UNLOCK MOON FIRST'}</button></div>`;$('unlockMothership').onclick=()=>unlockSystem('mothership',10000,'moonUnlocked');return}
    const modules=Object.entries(SYSTEM_MODULES).filter(([,m])=>m.unlocked());
    root.innerHTML+='<div class="system-modules">'+modules.map(([module,m])=>`<section class="system-module"><h3>${m.name}</h3><span class="terminal-sublabel">&lt;upgrades&gt;</span>${Object.keys(UPGRADE_DATA).filter(id=>UPGRADE_DATA[id].module===module).sort((a,b)=>UPGRADE_DATA[a].base-UPGRADE_DATA[b].base).map(upgradeCard).join('')}</section>`).join('')+'</div>';bindUpgrades(root);
  }
  const previousArea=renderArea;
  renderArea=function(){
    for(const id of ['moonScreen','mothershipScreen'])if($(id))$(id).hidden=true;
    document.body.dataset.spaceArea=['moon','mothership'].includes(state.currentArea)?state.currentArea:'';
    if(!['moon','mothership'].includes(state.currentArea))return previousArea();
    els.areaName.textContent=AREAS.find(a=>a.id===state.currentArea).name;els.island.style.display='none';els.islandShadow.style.display='none';els.caveScreen.style.display='none';els.areaPanel.classList.add('hidden');els.hatchSlot.style.display='none';if($('mutationLabScreen'))$('mutationLabScreen').style.display='none';
    if(state.currentArea==='moon')renderMoon();else renderMothership();window.ZoogleMusic?.setArea?.(state.currentArea);
  };
  // Breeding structural identity excludes countdowns and server clock corrections.
  const previousCave=renderCave;let caveKey='';
  renderCave=function(){const key=JSON.stringify([state.breedingUnlocked,getMaxBreedingSlots(),state.breedSelect,state.breedings.map(b=>[b.uid,b.p1Name,b.p2Name,b.intended,b.fallbackRarity])]);if(caveKey!==key||!els.caveScreen.firstElementChild){caveKey=key;previousCave()}renderCaveTimerOnly()};
  const previousHatchery=updateHatchSlot;
  updateHatchSlot=function(){const toggle=$('hatcheryToggle');if(toggle){toggle.hidden=!state.eggs.length;toggle.textContent='🥚 '+state.eggs.length;toggle.setAttribute('aria-expanded',String(!document.body.classList.contains('hatchery-collapsed')))}if(['lab','moon','mothership'].includes(state.currentArea)){els.hatchSlot.classList.remove('active');return}previousHatchery();renderSharedPlacement()};
  // World positions remain unchanged by display size; small screens clamp only their projection.
  safeBounds=function(){const r=els.island.getBoundingClientRect(),h=innerWidth<=740?104:124;return{minX:Math.min(25,48/Math.max(1,r.width)*100),maxX:Math.max(75,100-48/Math.max(1,r.width)*100),minY:Math.min(68,(h*.82+12)/Math.max(1,r.height)*100),maxY:88}};
  renderCollectAllButton=function(){const lvl=state.upgrades.collectAll||0,left=Math.max(0,(state.collectAllReadyAt||0)-worldNow());els.collectAllBtn.className='round-icon collect-all-btn '+(!lvl?'locked':left?'cooldown':'ready');els.collectAllBtn.style.display=lvl?'grid':'none';els.collectAllBtn.textContent=left?formatTime(left):'ALL';els.collectAllBtn.setAttribute('aria-label',left?'Collect all ready in '+formatTime(left):'Collect all earnings')};

  function renderAbduction(){
    const e=state.weather?.abduction,t=worldNow(),old=$('abductionFx');
    document.querySelectorAll('.abducting').forEach(z=>{if(!e||z.dataset.id!==e.targetUid||t>=e.endAt)z.classList.remove('abducting')});
    if(state.weather?.type!=='abduction'||!e||e.area!==state.currentArea||t>=e.endAt){old?.remove();return}
    const z=[...els.zoogleLayer.children].find(n=>n.dataset.id===e.targetUid);if(!z){old?.remove();return}
    let fx=old;if(!fx){fx=document.createElement('div');fx.id='abductionFx';fx.setAttribute('aria-hidden','true');fx.innerHTML='<div class="tractor-beam"></div><div class="abduction-ufo"><i></i><b></b></div>';document.body.appendChild(fx)}
    const r=z.getBoundingClientRect(),cx=Math.max(65,Math.min(innerWidth-65,r.left+r.width/2)),bottom=r.bottom-20,top=Math.max(12,Math.min(r.top-42,bottom-70));
    fx.style.left=cx+'px';fx.style.top=top+'px';fx.style.setProperty('--beam-height',Math.max(50,bottom-top)+'px');fx.className=t<e.startedAt+1400?'approaching':t>e.endAt-1600?'departing':'beaming';z.classList.toggle('abducting',t>=e.startedAt+1400&&t<e.endAt-1600);
  }
  // A separate HUD row prevents Passport and its request badge from covering resources.
  const hud=document.querySelector('.hud'),secondary=document.createElement('div');secondary.className='secondary-hud';hud.appendChild(secondary);
  const passport=$('worldVisitBtn');if(passport){passport.title='Island Passport';passport.setAttribute('aria-label','Island Passport');secondary.appendChild(passport)}
  const hatchToggle=document.createElement('button');hatchToggle.id='hatcheryToggle';hatchToggle.className='wood-btn';hatchToggle.setAttribute('aria-label','Toggle Hatchery');hatchToggle.onclick=()=>{document.body.classList.toggle('hatchery-collapsed');updateHatchSlot()};secondary.appendChild(hatchToggle);if(innerWidth<=900)document.body.classList.add('hatchery-collapsed');
  if($('mpPolishHud'))secondary.appendChild($('mpPolishHud'));
  if($('weatherBanner'))secondary.appendChild($('weatherBanner'));
  if($('visitorBanner'))hud.appendChild($('visitorBanner'));
  let layoutQueued=false;
  function measureLayout(){layoutQueued=false;const vh=visualViewport?.height||innerHeight;document.documentElement.style.setProperty('--usable-height',vh+'px');document.documentElement.style.setProperty('--hud-bottom',Math.ceil(hud.getBoundingClientRect().bottom+8)+'px');const dock=document.querySelector('.corner-buttons'),r=dock.getBoundingClientRect();document.documentElement.style.setProperty('--dock-height',Math.max(0,vh-r.top+8)+'px');renderAbduction()}
  function queueLayout(){if(layoutQueued)return;layoutQueued=true;requestAnimationFrame(measureLayout)}
  new ResizeObserver(queueLayout).observe(hud);new ResizeObserver(queueLayout).observe(document.querySelector('.corner-buttons'));
  window.addEventListener('resize',queueLayout);window.visualViewport?.addEventListener('resize',queueLayout);queueLayout();
  // Desktop action panels also remain in the visible viewport after resize/zoom.
  const previousMenu=openZoogleMenu;
  openZoogleMenu=function(...args){previousMenu(...args);requestAnimationFrame(()=>{const r=els.zoogleMenu.getBoundingClientRect();if(innerWidth>600&&!matchMedia('(orientation:landscape) and (max-height:600px)').matches){els.zoogleMenu.style.left=Math.max(8,Math.min(r.left,innerWidth-r.width-8))+'px';els.zoogleMenu.style.top=Math.max(8,Math.min(r.top,(visualViewport?.height||innerHeight)-r.height-8))+'px'}})};
  // One low-frequency service loop; it never installs subscriptions or event handlers.
  setInterval(()=>{
    renderAbduction();renderSharedPlacement();if(state.currentArea==='moon')renderMoon();
    const t=worldNow();if(W.busy||W.transitioning||W.awaitingHome||window.ZoogleIslandSharing?.visiting)return;
    const sp=state.sharedPlacement;
    if(sp?.ownerId===user()&&(placement||els.hatchOverlay.classList.contains('open'))&&sp.expiresAt-t<9000)W.run('placement-heartbeat',()=>{if(state.sharedPlacement?.id===sp.id&&state.sharedPlacement.ownerId===user())state.sharedPlacement.expiresAt=worldNow()+15000});
    if(t-lastBackground<1000)return;lastBackground=t;
    if(active()){
      if(mp().role==='host')W.run('tick',()=>{const dt=Math.max(0,Math.min(60000,t-(state.simulationAt||t)));state.simulationAt=t;window.ZoogleMultiplayer.tick(dt);refreshDailyQuestsIfNeeded();window.ZoogleMutationLab.finish()});
    }else W.run('tick',()=>{advanceMerchant();advanceAbduction();window.ZoogleMutationLab.finish()});
  },250);
  setInterval(()=>{if(active())W.pull()},2500);
  window.ZoogleAliens={merchantItems:MERCHANT_ITEMS,buyMerchant,advanceMerchant,useOwnedTotem,unlockMoon:()=>unlockSystem('moon',2000),unlockMothership:()=>unlockSystem('mothership',10000,'moonUnlocked'),renderMoon,renderMothership,renderAbduction,createAbduction,advanceAbduction,modules:SYSTEM_MODULES};
  renderShop();W.refresh();
})();
